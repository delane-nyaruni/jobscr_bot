name: Job Boards Cleaner

on:
  schedule:
    - cron: '0 3 * * 1'    # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  job_boards_cleaner:
    environment: USER_CREDENTIALS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Migrate Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
        run: python manage.py migrate --verbosity 3
        
      - name: Run Boards Cleaner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -u cleaning_engine/scripts/boards_cleaner.py