name: Job Boards Spider

on:
  schedule:
    - cron: '0 12 * * *'    # daily at 12:00 UTC
  workflow_dispatch:

jobs:
  job_boards_spider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --verbosity 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python scrapping_engine/scripts/boards_spider.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      - name: Commit pending boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/pending_boards.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-discovered boards [skip ci]"
          git push