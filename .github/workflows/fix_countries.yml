name: Fix Board Countries

on:
  workflow_dispatch:        # Allows you to manually trigger it from GitHub Actions tab

jobs:
  run_country_fixer:
    environment: USER_CREDENTIALS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
        run: timeout 60 python manage.py migrate --noinput --verbosity 3

      - name: Run Country Fixer Command
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
        run: python -u manage.py fix_countries