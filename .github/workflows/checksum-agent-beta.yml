name: checksum agent beta module

on:
  push:
    branches: [ "main" ]

jobs:
  checksum-agent-beta:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Production Check
      env:
        SECRET_KEY: "temporary-key-for-check" # Or use GitHub Secrets
      run: |
        python manage.py check --deploy --settings=dfms_backend.settings