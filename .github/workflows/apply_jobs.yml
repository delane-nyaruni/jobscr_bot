name: Mailing Robot

on:
  schedule:
    - cron: '*/20 * * * *'       # Every 20 minutes (3 times an hour, 72 times a day)
  workflow_dispatch:

jobs:
  apply_jobs:
    environment: USER_CREDENTIALS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --verbosity 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run Job Application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python mailing_engine/scripts/apply_jobs.py --live