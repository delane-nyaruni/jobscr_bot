name: Job Boards Spider

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job_boards_spider:
    environment: USER_CREDENTIALS 
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py migrate --verbosity 3

      - name: Run Board Discovery
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scrapping_engine/scripts/boards_spider.py

      - name: Commit pending boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/pending_boards.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-discovered boards [skip ci]"
          git push