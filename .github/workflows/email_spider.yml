name: Email Crawler

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (00:00, 02:00, 04:00, etc. UTC)
  workflow_dispatch:        # manual trigger

jobs:
  mail_spider:
    environment: USER_CREDENTIALS
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
        run: python manage.py migrate --verbosity 3

      - name: Run Email Spider
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          DJANGO_ENV: production
        run: python scrapping_engine/scripts/email_spider.py
