name: Crawl and Apply

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours (00:00, 04:00, 08:00, etc. UTC)
  workflow_dispatch:        # manual trigger

jobs:
  crawl_and_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --verbosity 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python scrapping_engine/scripts/email_spider.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          DJANGO_ENV: production